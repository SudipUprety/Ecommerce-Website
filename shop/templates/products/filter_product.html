{% extends 'base.html'%}
<title>{% block title %} Home {% endblock title %}</title>
{% block body %}
<div class="container py-2">
    <div class="row py-4 pb-0 pb-sm-4 align-items-center ">
<div class="main-logo">
    <a href="{{url_for('home')}}">
      <img src="{{ url_for('static', filename='images/logo.png')}}" alt="logo" class="img-fluid">
    </a>
  </div>
    </div></div>
{% include 'flash_message.html'%}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4 border-primary">
                <h1 class="text-center">Filter Products</h1>
                <form method="POST" action="{{ url_for('filterproduct') }}">
                    <div class="form-group">
                        <label for="category">Category:</label>
                        <select id="category" name="category" class="form-control">
                            <option value="">Select Category</option>
                            {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="min_price">Min Price:</label>
                        <input type="number" id="min_price" name="min_price" step="1" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="max_price">Max Price:</label>
                        <input type="number" id="max_price" name="max_price" step="1" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="min_rating">Min Rating:</label>
                        <select name="min_rating" id="min_rating" class="form-control">
                            <option value="">Select Rating</option>
                            <option value="1">1 and up</option>
                            <option value="2">2 and up</option>
                            <option value="3">3 and up</option>
                            <option value="4">4 and up</option>
                            <option value="5">5</option>
                        </select>
                    </div> <br>
                    <button type="submit" class="btn btn-primary btn-block" style="margin-left: 20vw;">Filter</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="container">
    <div class="row">
    <h2>Filtered Products</h2>
        {% for product in all_products %}
         {% include 'card/card.html' %}
        {% endfor %}
    </div></div>
{% endblock body %}
