{% extends 'base.html' %}
<title>{% block title %} Add category {% endblock title %}</title>
{% block body %}
<div class="container py-2">
  <div class="row py-4 pb-0 pb-sm-4 align-items-center ">
<div class="col-sm-4 col-lg-3 text-center text-sm-start">
  <div class="main-logo">
    <a href="{{url_for('viewcategory')}}">
      <img src="static/images/logo.png" alt="logo" class="img-fluid">
    </a>
  </div>
</div>
    <div class="container ">
        <div class="offset-md-3 col-md-6 my-5 ">
          {% include 'flash_message.html'%}
          <h2 class="display-3 fw-normal text-center">Add Category
          </h2>
          <form method="post">
            <div class="mb-3">
              <input type="text" class="form-control form-control-lg" name="category"
                placeholder="Enter Category">
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-dark btn-lg rounded-1">Add</button>
            </div>
          </form>
        </div>
      </div>
    </div>
</div>
{% endblock body %}
