{% extends 'base.html' %}
<title>{% block title %} Otp {% endblock title %}</title>
{% block body %}
<div class="container py-2">
  <div class="row py-4 pb-0 pb-sm-4 align-items-center ">

    <div class="col-sm-4 col-lg-3 text-center text-sm-start">
      <div class="main-logo">
        <a href="{{url_for('forgotpassword')}}">
            <iconify-icon icon="mdi:arrow-back-circle" width="50" height="50"></iconify-icon>
        </a>
      </div>
    </div>
    </div>
  </div>
    <div class="container ">
        <div class="offset-md-3 col-md-6 my-5 ">
          {% include 'flash_message.html'%}
          <h2 class="display-3 fw-normal text-center">Update Your Password
          </h2>
          <form method="post">
            <div  my-3 class="mb-3">
                <input type="password" class="form-control form-control-lg" name="password"
                  placeholder="Enter Your New Password">
              </div>
              <div  my-3 class="mb-3">
                <input type="password" class="form-control form-control-lg" name="repassword"
                  placeholder="Enter Your Repeat Password">
              </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-dark btn-lg rounded-1">Submit now</button>
            </div>
          </form>
        </div>
      </div>
    </div>

{% endblock body %}
