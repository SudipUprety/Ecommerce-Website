{% block content %}
<header>
  <div class="container py-2">
    <div class="row py-4 pb-0 pb-sm-4 align-items-center">
      <div class="col-sm-4 col-lg-3 text-center text-sm-start">
        <div class="main-logo">
          <a href="{{url_for('admin_home')}}">
            <img src="static/images/logo.png" alt="logo" class="img-fluid">
          </a>
        </div>
      </div>
      
      <div class="col-sm-8 col-lg-9 d-flex justify-content-between justify-content-sm-end align-items-center">
        <div class="support-box text-end">
          <span class="fs-6 secondary-font text-muted">
            Logout:
            <a href="{{url_for('adminlogout')}}" class="mx-3">
              <iconify-icon icon="majesticons:logout-line" width="20" height="20"></iconify-icon>
            </a>
          </span>
          <h5 class="mb-0">{{current_user.email}}</h5>
        </div>
      </div>
    </div>
  </div>
  
    <div class="container-fluid">
      <hr class="m-0">
    </div>
    <div class="container">
      <nav class="main-menu d-flex navbar navbar-expand-lg">
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-body justify-content-between">
            <ul class="navbar-nav menu-list list-unstyled d-flex gap-md-3 mb-0">
              <li class="nav-item">
                <a href="{{url_for('admin_home')}}" class="nav-link">Home</a>
              </li>
              <li class="nav-item">
                <a href="{{url_for('viewcategory')}}" class="nav-link">Category</a>
              </li>
              <li class="nav-item">
                <a href="{{url_for('viewuser')}}" class="nav-link">User</a>
              </li>
              {% if request.endpoint == 'admin_home' %}
              <li class="nav-item">
                <a class="nav-link" href="{{url_for('addproduct')}}">Add Products</a>
              </li>
              {% endif %}
              {% if request.endpoint == 'viewcategory' %}
              <li class="nav-item">
                <a class="nav-link" href="{{url_for('addcategory')}}">Add Category</a>
              </li>
              {% endif %}
              <li class="nav-item">
                <a class="nav-link" href="{{url_for('view_orders')}}">View Orders</a>
              </li>
            </ul>
            
            <ul class="navbar-nav menu-list list-unstyled d-flex gap-md-3 mb-0">
              <li class="nav-item">
                <a href="{{url_for('home')}}" class="nav-link"><b><u>User Home</u></b></a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>
  </header>
  {% endblock content %}
